<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Alien</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      width: 100%;
      height: 100%;
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }
    #game-container canvas { display: block; }
  </style>
</head>
<body>
  <div id="game-container"></div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script>
  // ═══════════════════════════════════════════════════════════════════════════
  // GAME DATA  (mirrors gameData.properties)
  // ═══════════════════════════════════════════════════════════════════════════
  const GAME_DATA = {
    window: { width: 596, height: 842 },

    player: {
      posY:                 700,
      speed:                5,
      initialLives:         3,
      shootCooldown:        20,
      hitInvincibilityTime: 120,
    },

    projectile: {
      speed: 8,
    },
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // PROJECTILE  (player bullet)
  // ═══════════════════════════════════════════════════════════════════════════
  class Projectile {
    constructor(scene, x, y, speed) {
      this.scene = scene;
      this.speed = speed;
      // Phaser.GameObjects.Image — origin defaults to centre (0.5, 0.5)
      this.go = scene.add.image(x, y, 'playerProjectile');
    }

    update(timescale) {
      this.go.y -= this.speed * timescale;
    }

    isOffScreen() {
      return this.go.y + this.go.height / 2 < 0;
    }

    destroy() {
      this.go.destroy();
    }

    getBounds() {
      return new Phaser.Geom.Rectangle(
        this.go.x - this.go.width  / 2,
        this.go.y - this.go.height / 2,
        this.go.width,
        this.go.height
      );
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PLAYER SHIP
  // ═══════════════════════════════════════════════════════════════════════════
  class PlayerShip {
    constructor(scene, x, y, cfg) {
      this.scene = scene;

      this.baseSpeed             = cfg.speed;
      this.initialLives          = cfg.initialLives;
      this.currentLives          = cfg.initialLives;
      this.baseShootCooldown     = cfg.shootCooldown;
      this.hitInvincibilityTime  = cfg.hitInvincibilityTime;
      this.screenW               = GAME_DATA.window.width;

      this.invincibleTimer    = 0;
      this.isShielded         = false;
      this.speedMultiplier    = 1.0;
      this.speedTimer         = 0;
      this.cooldownMultiplier = 1.0;
      this.cooldownTimer      = 0;
      this.frameSinceLastShot = 0;

      // Ship sprite — origin centre, matching Bagel's draw(x, y) convention
      this.go = scene.add.image(x, y, 'player');

      // Shield overlay — rendered on top of ship when invincible
      this.shieldGo = scene.add.image(x, y, 'invincible');
      this.shieldGo.setVisible(false);
    }

    update(keys, timescale) {
      this._tickTimers(timescale);
      this._move(keys, timescale);
      this._syncShieldVisual();
      return this._handleShooting(keys, timescale);
    }

    _tickTimers(timescale) {
      if (this.invincibleTimer > 0) {
        this.invincibleTimer -= timescale;
        if (this.invincibleTimer <= 0) this.isShielded = false;
      }
      if (this.speedTimer > 0) {
        this.speedTimer -= timescale;
        if (this.speedTimer <= 0) this.speedMultiplier = 1.0;
      }
      if (this.cooldownTimer > 0) {
        this.cooldownTimer -= timescale;
        if (this.cooldownTimer <= 0) this.cooldownMultiplier = 1.0;
      }
    }

    _move(keys, timescale) {
      const halfW = this.go.width / 2;
      const dist  = this.baseSpeed * this.speedMultiplier * timescale;
      let   x     = this.go.x;

      if (keys.A.isDown) x = Math.max(halfW, x - dist);
      if (keys.D.isDown) x = Math.min(this.screenW - halfW, x + dist);

      this.go.x       = x;
      this.shieldGo.x = x;
    }

    _syncShieldVisual() {
      this.shieldGo.setVisible(this.isInvincible());
      // Flash ship body during hit-stun only (not during shield powerup)
      const flash = this.invincibleTimer > 0 && !this.isShielded;
      this.go.setAlpha(flash ? (Math.floor(this.invincibleTimer / 6) % 2 === 0 ? 0.3 : 1) : 1);
    }

    _handleShooting(keys, timescale) {
      this.frameSinceLastShot += timescale;
      if (Phaser.Input.Keyboard.JustDown(keys.SPACE) &&
          this.frameSinceLastShot >= this.getShootCooldown()) {
        this.frameSinceLastShot = 0;
        return new Projectile(
          this.scene,
          this.go.x,
          this.go.y - this.go.height / 2 - 4,
          GAME_DATA.projectile.speed
        );
      }
      return null;
    }

    isInvincible()          { return this.invincibleTimer > 0 || this.isShielded; }
    applyHitInvincibility() { this.invincibleTimer = this.hitInvincibilityTime; }
    applyShield(d)          { this.isShielded = true; this.invincibleTimer = d; }
    applyEngine(d)          { this.speedMultiplier = 2.0; this.speedTimer = d; }
    applyCooldown(d)        { this.cooldownMultiplier = 1.0 / 3.0; this.cooldownTimer = d; }
    addLife()               { if (this.currentLives < this.initialLives) this.currentLives++; }
    decreaseLife()          { this.currentLives--; }
    getLives()              { return this.currentLives; }
    getShootCooldown()      { return Math.max(1, Math.floor(this.baseShootCooldown * this.cooldownMultiplier)); }
    getX()                  { return this.go.x; }
    getY()                  { return this.go.y; }

    getBounds() {
      return new Phaser.Geom.Rectangle(
        this.go.x - this.go.width  / 2,
        this.go.y - this.go.height / 2,
        this.go.width,
        this.go.height
      );
    }

    reset(x, y) {
      this.go.x = x;       this.go.y = y;
      this.shieldGo.x = x; this.shieldGo.y = y;
      this.currentLives       = this.initialLives;
      this.invincibleTimer    = 0;  this.isShielded         = false;
      this.speedMultiplier    = 1.0; this.speedTimer         = 0;
      this.cooldownMultiplier = 1.0; this.cooldownTimer      = 0;
      this.frameSinceLastShot = 0;
      this.go.setAlpha(1); this.shieldGo.setVisible(false);
    }

    destroy() { this.go.destroy(); this.shieldGo.destroy(); }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // BOOT SCENE  — loads all assets before GameScene starts
  // ═══════════════════════════════════════════════════════════════════════════
  class BootScene extends Phaser.Scene {
    constructor() { super({ key: 'BootScene' }); }

    preload() {
      // Player
      this.load.image('player',       'res/playerSpaceship.png');
      this.load.image('invincible',   'res/invincible.png');
      this.load.image('playerLife',   'res/playerLife.png');

      // Projectiles
      this.load.image('playerProjectile', 'res/playerProjectile.png');
      this.load.image('enemyProjectile',  'res/enemyProjectile.png');

      // Enemies
      this.load.image('regularEnemy',  'res/regularEnemy.png');
      this.load.image('strafingEnemy', 'res/strafingEnemy.png');
      this.load.image('shootingEnemy', 'res/shootingEnemy.png');

      // Powerups
      this.load.image('shieldPowerup',   'res/shieldPowerup.png');
      this.load.image('lifePowerup',     'res/lifePowerup.png');
      this.load.image('cooldownPowerup', 'res/cooldownPowerup.png');
      this.load.image('enginePowerup',   'res/enginePowerup.png');

      // Explosions
      this.load.image('explosionLarge', 'res/explosionLarge.png');
      this.load.image('explosionSmall', 'res/explosionSmall.png');
    }

    // Phaser only calls create() once preload() is fully complete
    create() {
      this.scene.start('GameScene');
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    create() {
      const cfg    = GAME_DATA.player;
      const startX = GAME_DATA.window.width / 2;

      this.keys = this.input.keyboard.addKeys({
        A:     Phaser.Input.Keyboard.KeyCodes.A,
        D:     Phaser.Input.Keyboard.KeyCodes.D,
        SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE,
        ESC:   Phaser.Input.Keyboard.KeyCodes.ESC,
        R:     Phaser.Input.Keyboard.KeyCodes.R,
        F:     Phaser.Input.Keyboard.KeyCodes.F,
        G:     Phaser.Input.Keyboard.KeyCodes.G,
      });

      this.player      = new PlayerShip(this, startX, cfg.posY, cfg);
      this.projectiles = [];
      this.timescale      = 1.0;
      this.timescaleLevel = 1;

      this.debugText = this.add.text(8, 8, '', {
        fontSize: '13px', fill: '#ffffff', fontFamily: 'monospace',
      }).setDepth(10);

      this.scene.launch('UIScene');
    }

    update() {
      if (Phaser.Input.Keyboard.JustDown(this.keys.G)) this.timescaleLevel++;
      if (Phaser.Input.Keyboard.JustDown(this.keys.F)) this.timescaleLevel--;
      this.timescale = this.timescaleLevel >= 1
        ? this.timescaleLevel
        : 1.0 / Math.abs(this.timescaleLevel);

      const shot = this.player.update(this.keys, this.timescale);
      if (shot) this.projectiles.push(shot);

      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        this.projectiles[i].update(this.timescale);
        if (this.projectiles[i].isOffScreen()) {
          this.projectiles[i].destroy();
          this.projectiles.splice(i, 1);
        }
      }

      const p = this.player;
      this.debugText.setText([
        `Lives: ${p.getLives()}`,
        `Invincible: ${p.isInvincible()}`,
        `Cooldown: ${p.getShootCooldown()} frames`,
        `Speed×: ${p.speedMultiplier.toFixed(1)}`,
        `Timescale: ${this.timescale.toFixed(2)} (level ${this.timescaleLevel})`,
        `Projectiles: ${this.projectiles.length}`,
      ]);
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // UI SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class UIScene extends Phaser.Scene {
    constructor() { super({ key: 'UIScene' }); }
    create()  {}
    update()  {}
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PHASER CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const config = {
    type: Phaser.AUTO,
    width:  GAME_DATA.window.width,
    height: GAME_DATA.window.height,
    backgroundColor: '#000000',
    parent: 'game-container',
    scene: [BootScene, GameScene, UIScene],
    scale: {
      mode:       Phaser.Scale.NONE,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
  };

  new Phaser.Game(config);
  </script>
</body>
</html>
