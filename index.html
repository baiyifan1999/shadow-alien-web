<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Shadow Alien</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #000;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      overflow: hidden;
    }
    canvas { display: block; }
  </style>
</head>
<body>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/phaser/3.60.0/phaser.min.js"></script>
  <script>
  // ═══════════════════════════════════════════════════════════════════════════
  // GAME DATA  (mirrors gameData.properties)
  // ═══════════════════════════════════════════════════════════════════════════
  const GAME_DATA = {
    window: { width: 596, height: 842 },

    player: {
      posY:          700,
      speed:         5,
      initialLives:  3,
      shootCooldown: 20,   // frames
      hitInvincibilityTime: 120,
    },

    projectile: {
      speed: 8,
    },
  };

  // ═══════════════════════════════════════════════════════════════════════════
  // PROJECTILE  (player bullet)
  // ═══════════════════════════════════════════════════════════════════════════
  class Projectile {
    /**
     * @param {Phaser.Scene} scene
     * @param {number} x
     * @param {number} y
     * @param {number} speed  pixels per logical frame, travels upward
     */
    constructor(scene, x, y, speed) {
      this.scene = scene;
      this.speed = speed;

      // Placeholder: white 4×16 rectangle until real sprite is loaded.
      this.go = scene.add.rectangle(x, y, 4, 16, 0xffffff);
    }

    /** @param {number} timescale */
    update(timescale) {
      this.go.y -= this.speed * timescale;
    }

    isOffScreen() {
      return this.go.y + 8 < 0;
    }

    destroy() {
      this.go.destroy();
    }

    getBounds() {
      return new Phaser.Geom.Rectangle(
        this.go.x - 2, this.go.y - 8, 4, 16
      );
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PLAYER SHIP
  // Mirrors PlayerShip.java exactly:
  //   • A/D movement bounded by screen edges
  //   • Two independent invincibility sources: hit-stun timer + shield flag
  //   • Engine powerup  → speedMultiplier = 2 for speedTimer frames
  //   • Cooldown powerup → cooldownMultiplier = 1/3 for cooldownTimer frames
  //   • Shoot on SPACE when frameSinceLastShot >= getShootCooldown()
  // ═══════════════════════════════════════════════════════════════════════════
  class PlayerShip {
    /**
     * @param {Phaser.Scene} scene
     * @param {number} x
     * @param {number} y
     * @param {object} cfg   subset of GAME_DATA.player
     */
    constructor(scene, x, y, cfg) {
      this.scene = scene;

      this.baseSpeed        = cfg.speed;
      this.initialLives     = cfg.initialLives;
      this.currentLives     = cfg.initialLives;
      this.baseShootCooldown = cfg.shootCooldown;
      this.hitInvincibilityTime = cfg.hitInvincibilityTime;

      this.screenW = GAME_DATA.window.width;

      // invincibility
      this.invincibleTimer = 0;   // counts down in logical frames
      this.isShielded      = false;

      // engine powerup
      this.speedMultiplier = 1.0;
      this.speedTimer      = 0;

      // cooldown powerup
      this.cooldownMultiplier = 1.0;
      this.cooldownTimer      = 0;

      // shooting
      this.frameSinceLastShot = 0;

      // Placeholder ship: blue 40×24 rectangle.
      // Origin is centre (Phaser default for shapes), matching Bagel behaviour.
      this.go = scene.add.rectangle(x, y, 40, 24, 0x4488ff);

      // Placeholder shield ring (hidden by default).
      this.shieldGo = scene.add.ellipse(x, y, 56, 56, 0x00ffff, 0);
      this.shieldGo.setStrokeStyle(2, 0x00ffff);
      this.shieldGo.setVisible(false);
    }

    // ── per-frame update ─────────────────────────────────────────────────────

    /**
     * @param {Phaser.Types.Input.Keyboard.CursorKeys|object} keys  cursors + extra keys
     * @param {number} timescale
     * @returns {Projectile|null}  a new projectile if fired this frame, else null
     */
    update(keys, timescale) {
      this._tickTimers(timescale);
      this._move(keys, timescale);
      this._syncShieldVisual();

      return this._handleShooting(keys, timescale);
    }

    _tickTimers(timescale) {
      if (this.invincibleTimer > 0) {
        this.invincibleTimer -= timescale;
        if (this.invincibleTimer <= 0) {
          this.isShielded = false;
        }
      }

      if (this.speedTimer > 0) {
        this.speedTimer -= timescale;
        if (this.speedTimer <= 0) {
          this.speedMultiplier = 1.0;
        }
      }

      if (this.cooldownTimer > 0) {
        this.cooldownTimer -= timescale;
        if (this.cooldownTimer <= 0) {
          this.cooldownMultiplier = 1.0;
        }
      }
    }

    _move(keys, timescale) {
      const halfW = this.go.width / 2;
      const dist  = this.baseSpeed * this.speedMultiplier * timescale;
      let   x     = this.go.x;

      if (keys.A.isDown) {
        x = Math.max(halfW, x - dist);
      }
      if (keys.D.isDown) {
        x = Math.min(this.screenW - halfW, x + dist);
      }

      this.go.x = x;
      this.shieldGo.x = x;
    }

    _syncShieldVisual() {
      const inv = this.isInvincible();
      this.shieldGo.setVisible(inv);
      // Flash the ship body during hit-stun (not during shield powerup).
      const flash = this.invincibleTimer > 0 && !this.isShielded;
      this.go.setAlpha(flash ? (Math.floor(this.invincibleTimer / 6) % 2 === 0 ? 0.3 : 1) : 1);
    }

    /**
     * Mirrors handleShooting() in ShadowAliens.java.
     * frameSinceLastShot accumulates every update; fires when it exceeds cooldown.
     */
    _handleShooting(keys, timescale) {
      this.frameSinceLastShot += timescale;

      if (Phaser.Input.Keyboard.JustDown(keys.SPACE) &&
          this.frameSinceLastShot >= this.getShootCooldown()) {

        this.frameSinceLastShot = 0;
        return new Projectile(
          this.scene,
          this.go.x,
          this.go.y - this.go.height / 2 - 8,
          GAME_DATA.projectile.speed
        );
      }
      return null;
    }

    // ── invincibility ────────────────────────────────────────────────────────

    isInvincible() {
      return this.invincibleTimer > 0 || this.isShielded;
    }

    /** Short hit-stun invincibility (no shield graphic difference in Java). */
    applyHitInvincibility() {
      this.invincibleTimer = this.hitInvincibilityTime;
    }

    /** Shield powerup — shows shield ring, same invincibleTimer mechanism. */
    applyShield(duration) {
      this.isShielded = true;
      this.invincibleTimer = duration;
    }

    // ── powerups ─────────────────────────────────────────────────────────────

    applyEngine(duration) {
      this.speedMultiplier = 2.0;
      this.speedTimer      = duration;
    }

    applyCooldown(duration) {
      this.cooldownMultiplier = 1.0 / 3.0;
      this.cooldownTimer      = duration;
    }

    addLife() {
      if (this.currentLives < this.initialLives) {
        this.currentLives++;
      }
    }

    // ── lives ────────────────────────────────────────────────────────────────

    decreaseLife() {
      this.currentLives--;
    }

    getLives() { return this.currentLives; }

    // ── getters ──────────────────────────────────────────────────────────────

    /** Effective cooldown in logical frames — matches Java's Math.max(1, floor). */
    getShootCooldown() {
      return Math.max(1, Math.floor(this.baseShootCooldown * this.cooldownMultiplier));
    }

    getX() { return this.go.x; }
    getY() { return this.go.y; }

    getBounds() {
      return new Phaser.Geom.Rectangle(
        this.go.x - this.go.width / 2,
        this.go.y - this.go.height / 2,
        this.go.width,
        this.go.height
      );
    }

    // ── reset ────────────────────────────────────────────────────────────────

    reset(initialX, initialY) {
      this.go.x = initialX;
      this.go.y = initialY;
      this.shieldGo.x = initialX;
      this.shieldGo.y = initialY;

      this.currentLives       = this.initialLives;
      this.invincibleTimer    = 0;
      this.isShielded         = false;
      this.speedMultiplier    = 1.0;
      this.speedTimer         = 0;
      this.cooldownMultiplier = 1.0;
      this.cooldownTimer      = 0;
      this.frameSinceLastShot = 0;

      this.go.setAlpha(1);
      this.shieldGo.setVisible(false);
    }

    destroy() {
      this.go.destroy();
      this.shieldGo.destroy();
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // BOOT SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class BootScene extends Phaser.Scene {
    constructor() { super({ key: 'BootScene' }); }

    preload() {
      // Sprite/audio loading goes here in a future iteration.
    }

    create() {
      this.scene.start('GameScene');
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // GAME SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class GameScene extends Phaser.Scene {
    constructor() { super({ key: 'GameScene' }); }

    create() {
      const cfg = GAME_DATA.player;
      const startX = GAME_DATA.window.width / 2;

      // Keyboard bindings
      this.keys = this.input.keyboard.addKeys({
        A:     Phaser.Input.Keyboard.KeyCodes.A,
        D:     Phaser.Input.Keyboard.KeyCodes.D,
        SPACE: Phaser.Input.Keyboard.KeyCodes.SPACE,
        ESC:   Phaser.Input.Keyboard.KeyCodes.ESC,
        R:     Phaser.Input.Keyboard.KeyCodes.R,
        F:     Phaser.Input.Keyboard.KeyCodes.F,
        G:     Phaser.Input.Keyboard.KeyCodes.G,
      });

      this.player      = new PlayerShip(this, startX, cfg.posY, cfg);
      this.projectiles = [];

      // Timescale (developer mode, F/G keys as in Java)
      this.timescale      = 1.0;
      this.timescaleLevel = 1;

      // Debug label (top-left)
      this.debugText = this.add.text(8, 8, '', {
        fontSize: '13px', fill: '#ffffff', fontFamily: 'monospace'
      }).setDepth(10);

      this.scene.launch('UIScene');
    }

    update(_time, _delta) {
      this._handleTimescaleInput();

      // Update player; collect any new projectile
      const shot = this.player.update(this.keys, this.timescale);
      if (shot) this.projectiles.push(shot);

      // Update projectiles, remove off-screen
      for (let i = this.projectiles.length - 1; i >= 0; i--) {
        this.projectiles[i].update(this.timescale);
        if (this.projectiles[i].isOffScreen()) {
          this.projectiles[i].destroy();
          this.projectiles.splice(i, 1);
        }
      }

      this._updateDebug();
    }

    _handleTimescaleInput() {
      if (Phaser.Input.Keyboard.JustDown(this.keys.G)) this.timescaleLevel++;
      if (Phaser.Input.Keyboard.JustDown(this.keys.F)) this.timescaleLevel--;
      this.timescale = this.timescaleLevel >= 1
        ? this.timescaleLevel
        : 1.0 / Math.abs(this.timescaleLevel);
    }

    _updateDebug() {
      const p = this.player;
      this.debugText.setText([
        `Lives: ${p.getLives()}`,
        `Invincible: ${p.isInvincible()}`,
        `Cooldown: ${p.getShootCooldown()} frames`,
        `Speed×: ${p.speedMultiplier.toFixed(1)}`,
        `Timescale: ${this.timescale.toFixed(2)} (level ${this.timescaleLevel})`,
        `Projectiles: ${this.projectiles.length}`,
      ]);
    }
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // UI SCENE
  // ═══════════════════════════════════════════════════════════════════════════
  class UIScene extends Phaser.Scene {
    constructor() { super({ key: 'UIScene' }); }

    create() {
      // HUD elements will go here once scoring and waves are wired up.
    }

    update(_time, _delta) {}
  }

  // ═══════════════════════════════════════════════════════════════════════════
  // PHASER CONFIG
  // ═══════════════════════════════════════════════════════════════════════════
  const config = {
    type: Phaser.AUTO,
    width:  GAME_DATA.window.width,
    height: GAME_DATA.window.height,
    backgroundColor: '#000000',
    scene: [BootScene, GameScene, UIScene],
    parent: document.body,
    scale: {
      mode:       Phaser.Scale.FIT,
      autoCenter: Phaser.Scale.CENTER_BOTH,
    },
  };

  const game = new Phaser.Game(config);
  </script>
</body>
</html>
